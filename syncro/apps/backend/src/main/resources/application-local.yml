server:
  port: ${SERVER_PORT:8080}

spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:syncro}
    username: ${POSTGRES_USER:syncro}
    password: ${POSTGRES_PASSWORD:syncro_dev}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

syncro:
  auth:
    jwt:
      secret: ${SYNCRO_AUTH_JWT_SECRET:syncro-local-jwt-secret-change-before-shared-use}
      issuer: ${SYNCRO_AUTH_JWT_ISSUER:syncro-local}
      ttl-minutes: ${SYNCRO_AUTH_JWT_TTL_MINUTES:480}
    local-admin:
      enabled: ${SYNCRO_AUTH_LOCAL_ADMIN_ENABLED:true}
      login-identifier: ${SYNCRO_AUTH_LOCAL_ADMIN_LOGIN:admin@syncro.dev}
      password: ${SYNCRO_AUTH_LOCAL_ADMIN_PASSWORD:syncro-admin-dev}
  mqtt:
    host: ${SYNCRO_MQTT_HOST:localhost}
    port: ${SYNCRO_MQTT_PORT:1883}
    username: ${SYNCRO_MQTT_USERNAME:syncro_backend}
    password: ${SYNCRO_MQTT_PASSWORD:Syncro@Mqtt#2026!Dev}
    client-id: ${SYNCRO_MQTT_CLIENT_ID:syncro-backend-1}
    topic-filter: ${SYNCRO_MQTT_TOPIC_FILTER:factory/+/+/telemetry}
  influxdb:
    url: http://${INFLUXDB_HOST:localhost}:${INFLUXDB_PORT:8086}
    username: ${INFLUXDB_USERNAME:syncro}
    password: ${INFLUXDB_PASSWORD:syncro_dev_password}
    token: ${INFLUXDB_TOKEN:syncro-dev-token}
    org: ${INFLUXDB_ORG:syncro}
    bucket: ${INFLUXDB_BUCKET:syncro_telemetry}
  waha:
    url: http://${WAHA_HOST:localhost}:${WAHA_PORT:3000}
    api-key: ${WAHA_API_KEY:syncro-waha-dev-key}
  garage:
    url: http://${GARAGE_HOST:localhost}:${GARAGE_S3_PORT:3900}
    access-key: ${GARAGE_ACCESS_KEY:syncro-garage-dev}
    secret-key: ${GARAGE_SECRET_KEY:syncro-garage-dev-secret}
    bucket: ${GARAGE_BUCKET:syncro-spareparts}
    region: ${GARAGE_REGION:garage}
    presign-ttl-seconds: ${GARAGE_PRESIGN_TTL_SECONDS:300}
  sparepart:
    image:
      max-bytes: ${SYNCRO_SPAREPART_IMAGE_MAX_BYTES:5242880}
