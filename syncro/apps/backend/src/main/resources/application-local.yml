server:
  port: ${SERVER_PORT:8080}

spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:syncro}
    username: ${POSTGRES_USER:syncro}
    password: ${POSTGRES_PASSWORD:syncro_dev}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

syncro:
  mqtt:
    host: ${SYNCRO_MQTT_HOST:localhost}
    port: ${SYNCRO_MQTT_PORT:1883}
    username: ${SYNCRO_MQTT_USERNAME:syncro_backend}
    password: ${SYNCRO_MQTT_PASSWORD:syncro_mqtt_dev}
    client-id: ${SYNCRO_MQTT_CLIENT_ID:syncro-backend-1}
    topic-filter: ${SYNCRO_MQTT_TOPIC_FILTER:factory/+/+/telemetry}
  influxdb:
    url: http://${INFLUXDB_HOST:localhost}:${INFLUXDB_PORT:8086}
    username: ${INFLUXDB_USERNAME:syncro}
    password: ${INFLUXDB_PASSWORD:syncro_dev_password}
    token: ${INFLUXDB_TOKEN:syncro-dev-token}
    org: ${INFLUXDB_ORG:syncro}
    bucket: ${INFLUXDB_BUCKET:syncro_telemetry}
  waha:
    url: http://${WAHA_HOST:localhost}:${WAHA_PORT:3000}
    api-key: ${WAHA_API_KEY:syncro-waha-dev-key}
