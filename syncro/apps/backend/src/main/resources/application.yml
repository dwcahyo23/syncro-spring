server:
  port: ${SERVER_PORT}

spring:
  application:
    name: syncro-backend
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always

syncro:
  auth:
    jwt:
      secret: ${SYNCRO_AUTH_JWT_SECRET}
      issuer: ${SYNCRO_AUTH_JWT_ISSUER}
      ttl-minutes: ${SYNCRO_AUTH_JWT_TTL_MINUTES}
    local-admin:
      enabled: ${SYNCRO_AUTH_LOCAL_ADMIN_ENABLED:false}
      login-identifier: ${SYNCRO_AUTH_LOCAL_ADMIN_LOGIN:disabled@syncro.local}
      password: ${SYNCRO_AUTH_LOCAL_ADMIN_PASSWORD:disabled}
  mqtt:
    host: ${SYNCRO_MQTT_HOST}
    port: ${SYNCRO_MQTT_PORT}
    username: ${SYNCRO_MQTT_USERNAME}
    password: ${SYNCRO_MQTT_PASSWORD}
    client-id: ${SYNCRO_MQTT_CLIENT_ID}
    topic-filter: ${SYNCRO_MQTT_TOPIC_FILTER}
  influxdb:
    url: http://${INFLUXDB_HOST}:${INFLUXDB_PORT}
    token: ${INFLUXDB_TOKEN}
    database: ${INFLUXDB_DATABASE}
  waha:
    url: http://${WAHA_HOST}:${WAHA_PORT}
    api-key: ${WAHA_API_KEY}
  notification:
    worker:
      # Poll interval in milliseconds for the notification dispatch worker (default: 30 seconds)
      poll-interval-ms: ${SYNCRO_NOTIFICATION_WORKER_POLL_INTERVAL_MS:30000}
    escalation:
      # Escalation interval in milliseconds — how long a SENT job must age before escalating (default: 15 minutes)
      interval-ms: ${SYNCRO_NOTIFICATION_ESCALATION_INTERVAL_MS:900000}
      # Poll interval in milliseconds for the escalation worker (default: 60 seconds)
      poll-interval-ms: ${SYNCRO_NOTIFICATION_ESCALATION_POLL_INTERVAL_MS:60000}
    rate-limit:
      # Deduplication window in milliseconds — prevents re-sending to the same alert+recipient
      # within this window after a successful WAHA send (default: 5 minutes)
      window-ms: ${SYNCRO_NOTIFICATION_RATE_LIMIT_WINDOW_MS:300000}
  telemetry:
    ingest:
      queue-capacity: 1000
      worker-threads: 2
  cache:
    telemetry:
      ttl-minutes: 5
      max-size: 1000
