server:
  port: ${SERVER_PORT}

spring:
  application:
    name: syncro-backend
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

syncro:
  mqtt:
    host: ${SYNCRO_MQTT_HOST}
    port: ${SYNCRO_MQTT_PORT}
    username: ${SYNCRO_MQTT_USERNAME}
    password: ${SYNCRO_MQTT_PASSWORD}
    client-id: ${SYNCRO_MQTT_CLIENT_ID}
    topic-filter: ${SYNCRO_MQTT_TOPIC_FILTER}
  influxdb:
    url: http://${INFLUXDB_HOST}:${INFLUXDB_PORT}
    username: ${INFLUXDB_USERNAME}
    password: ${INFLUXDB_PASSWORD}
    token: ${INFLUXDB_TOKEN}
    org: ${INFLUXDB_ORG}
    bucket: ${INFLUXDB_BUCKET}
  waha:
    url: http://${WAHA_HOST}:${WAHA_PORT}
    api-key: ${WAHA_API_KEY}
