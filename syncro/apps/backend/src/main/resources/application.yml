server:
  port: ${SERVER_PORT}

spring:
  application:
    name: syncro-backend
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      # DW-47: client-level Redis command timeout (Lettuce). Bounds the health-indicator
      # PING and all Redis command paths so a stalled Redis cannot block for the 60s default.
      timeout: ${SYNCRO_REDIS_COMMAND_TIMEOUT_MS:2000}ms
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      # Above the domain limit (5 MB sparepart image, 10 MB workorder evidence) so the
      # domain services are the enforcement point; the container only backstops.
      max-file-size: 25MB
      max-request-size: 25MB
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
      group:
        readiness:
          include: "*"
          exclude: "wahaCircuitBreaker"
  health:
    # Custom enriched indicators in com.syncro.health replace the auto-configured ones.
    db:
      enabled: false
    redis:
      enabled: false

syncro:
  auth:
    jwt:
      secret: ${SYNCRO_AUTH_JWT_SECRET}
      issuer: ${SYNCRO_AUTH_JWT_ISSUER}
      ttl-minutes: ${SYNCRO_AUTH_JWT_TTL_MINUTES}
    local-admin:
      enabled: ${SYNCRO_AUTH_LOCAL_ADMIN_ENABLED:false}
      login-identifier: ${SYNCRO_AUTH_LOCAL_ADMIN_LOGIN:disabled@syncro.local}
      password: ${SYNCRO_AUTH_LOCAL_ADMIN_PASSWORD:disabled}
  mqtt:
    host: ${SYNCRO_MQTT_HOST}
    port: ${SYNCRO_MQTT_PORT}
    username: ${SYNCRO_MQTT_USERNAME}
    password: ${SYNCRO_MQTT_PASSWORD}
    client-id: ${SYNCRO_MQTT_CLIENT_ID}
    topic-filter: ${SYNCRO_MQTT_TOPIC_FILTER}
  influxdb:
    url: http://${INFLUXDB_HOST}:${INFLUXDB_PORT}
    token: ${INFLUXDB_TOKEN}
    database: ${INFLUXDB_DATABASE}
  garage:
    url: http://${GARAGE_HOST}:${GARAGE_S3_PORT}
    access-key: ${GARAGE_ACCESS_KEY}
    secret-key: ${GARAGE_SECRET_KEY}
    bucket: ${GARAGE_BUCKET}
    region: ${GARAGE_REGION:garage}
    presign-ttl-seconds: ${GARAGE_PRESIGN_TTL_SECONDS:300}
  sparepart:
    image:
      max-bytes: ${SYNCRO_SPAREPART_IMAGE_MAX_BYTES:5242880}
  workorder:
    evidence:
      max-bytes: ${SYNCRO_WORKORDER_EVIDENCE_MAX_BYTES:10485760}
  waha:
    url: http://${WAHA_HOST}:${WAHA_PORT}
    api-key: ${WAHA_API_KEY}
    resilience:
      # HTTP connect + read timeout per WAHA call (default: 5 seconds)
      timeout: ${SYNCRO_WAHA_TIMEOUT_MS:5000}ms
      # Failure-rate threshold (%) at which the circuit opens (default: 50%)
      failure-rate-threshold: ${SYNCRO_WAHA_CB_FAILURE_RATE:50}
      # Minimum number of calls before failure rate is evaluated (default: 5)
      minimum-number-of-calls: ${SYNCRO_WAHA_CB_MIN_CALLS:5}
      # Sliding window size for failure rate computation (default: 10)
      sliding-window-size: ${SYNCRO_WAHA_CB_WINDOW_SIZE:10}
      # Time circuit stays OPEN before transitioning to HALF_OPEN (default: 60 seconds)
      wait-duration-in-open-state: ${SYNCRO_WAHA_CB_WAIT_MS:60000}ms
      # Number of probe calls allowed in HALF_OPEN state (default: 3)
      permitted-calls-in-half-open: ${SYNCRO_WAHA_CB_HALF_OPEN_CALLS:3}
  opa:
    url: http://${OPA_HOST}:${OPA_PORT}
    resilience:
      # HTTP connect + read timeout per OPA call (default: 5 seconds)
      timeout: ${SYNCRO_OPA_TIMEOUT_MS:5000}ms
      # Failure-rate threshold (%) at which the circuit opens (default: 50%)
      failure-rate-threshold: ${SYNCRO_OPA_CB_FAILURE_RATE:50}
      # Minimum number of calls before failure rate is evaluated (default: 2 since 9.5 —
      # a hung OPA sidecar must trip the breaker fast under live enforcement, DW-130)
      minimum-number-of-calls: ${SYNCRO_OPA_CB_MIN_CALLS:2}
      # Sliding window size for failure rate computation (default: 10)
      sliding-window-size: ${SYNCRO_OPA_CB_WINDOW_SIZE:10}
      # Time circuit stays OPEN before transitioning to HALF_OPEN (default: 60 seconds)
      wait-duration-in-open-state: ${SYNCRO_OPA_CB_WAIT_MS:60000}ms
      # Number of probe calls allowed in HALF_OPEN state (default: 3)
      permitted-calls-in-half-open: ${SYNCRO_OPA_CB_HALF_OPEN_CALLS:3}
  authz:
    # Paths gated by the AuthzInterceptor; empty until story 9.5 rolls out enforcement
    enforced-paths: ${SYNCRO_AUTHZ_ENFORCED_PATHS:}
    # Ant patterns still allowed when OPA is unreachable (fail-deny everywhere else)
    degraded-allowlist: ${SYNCRO_AUTHZ_DEGRADED_ALLOWLIST:/api/v1/health,/actuator/**}
    # Paths that bypass OPA entirely (DW-129): anonymous health/read probes stay 200 while
    # OPA is healthy — the degraded-allowlist alone cannot express "always public"
    always-public-paths: ${SYNCRO_AUTHZ_ALWAYS_PUBLIC_PATHS:/api/v1/health,/actuator/**}
    # Policy file used to derive the decision-log revision when OPA does not emit a bundle
    # revision; classpath: or file: resource (default: classpath:authz-policy.rego)
    policy-revision-fallback-path: ${SYNCRO_AUTHZ_POLICY_FILE:}
    decision-log:
      # Retention window for persisted authz decisions (default: 30 days)
      retention-days: ${SYNCRO_AUTHZ_DECISION_LOG_RETENTION_DAYS:30}
      # Purge job cadence for the decision log (default: hourly)
      purge-interval-ms: ${SYNCRO_AUTHZ_DECISION_LOG_PURGE_INTERVAL_MS:3600000}
  notification:
    worker:
      # Poll interval in milliseconds for the notification dispatch worker (default: 30 seconds)
      poll-interval-ms: ${SYNCRO_NOTIFICATION_WORKER_POLL_INTERVAL_MS:30000}
      # Worker considered DEGRADED when the last poll is older than this (default: 5 minutes)
      stale-threshold: ${SYNCRO_NOTIFICATION_WORKER_STALE_THRESHOLD:PT5M}
      # Window for the recent-failed notification count in worker status (default: 1 hour)
      failed-window: ${SYNCRO_NOTIFICATION_WORKER_FAILED_WINDOW:PT1H}
    escalation:
      # Escalation interval in milliseconds — how long a SENT job must age before escalating (default: 15 minutes)
      interval-ms: ${SYNCRO_NOTIFICATION_ESCALATION_INTERVAL_MS:900000}
      # Poll interval in milliseconds for the escalation worker (default: 60 seconds)
      poll-interval-ms: ${SYNCRO_NOTIFICATION_ESCALATION_POLL_INTERVAL_MS:60000}
    rate-limit:
      # Deduplication window in milliseconds — prevents re-sending to the same alert+recipient
      # within this window after a successful WAHA send (default: 5 minutes)
      window-ms: ${SYNCRO_NOTIFICATION_RATE_LIMIT_WINDOW_MS:300000}
  telemetry:
    ingest:
      queue-capacity: 1000
      worker-threads: 2
  projection:
    # Counter-rate estimation window in days (story 8-6)
    window-days: ${SYNCRO_PROJECTION_WINDOW_DAYS:30}
    # Samples older than this are considered stale and gate the estimate off (default: 48 hours)
    staleness: ${SYNCRO_PROJECTION_STALENESS:PT48H}
    # Redis cache TTL for computed machine projections (default: 5 minutes)
    cache-ttl: ${SYNCRO_PROJECTION_CACHE_TTL:PT5M}
    # IANA zone used only at the wall-clock boundary for shift-window math
    plant-timezone: ${SYNCRO_PROJECTION_PLANT_TIMEZONE:Asia/Jakarta}
  cache:
    telemetry:
      ttl-minutes: 5
      max-size: 1000
  dashboard:
    # Redis cache TTL for computed dashboard analytics (MTBF/MTTR, technician KPI).
    # Env-overridable via SYNCRO_DASHBOARD_ANALYTICS_TTL (default: 30 minutes).
    analytics-ttl: ${SYNCRO_DASHBOARD_ANALYTICS_TTL:PT30M}
  kpi:
    # Monthly KPI materialization (story 20-1, AD-20). Master switch for the scheduler
    # and the sync-invalidation listener.
    enabled: ${SYNCRO_KPI_ENABLED:true}
    # Cron for the scheduled refresh sweep (default: daily 03:00 UTC).
    refresh-cron: ${SYNCRO_KPI_REFRESH_CRON:0 0 3 * * *}
    # Past months re-materialized per sweep (late corrections, backdated sync rows).
    lookback-months: ${SYNCRO_KPI_LOOKBACK_MONTHS:1}
  sync:
    # External workorder sync pipeline (story 13-1, AD-7/FR-150). Disabled by default:
    # the app boots without an external DB. Flip to true and supply syncro.sync.datasource.*
    # (via env) to activate the scheduled worker.
    enabled: ${SYNCRO_SYNC_ENABLED:false}
    datasource:
      url: ${SYNCRO_SYNC_DATASOURCE_URL:}
      username: ${SYNCRO_SYNC_DATASOURCE_USERNAME:}
      password: ${SYNCRO_SYNC_DATASOURCE_PASSWORD:}
    # Rows per batch (default 100)
    batch-size: ${SYNCRO_SYNC_BATCH_SIZE:100}
    # Poll interval in milliseconds (default 60 seconds)
    poll-interval-ms: ${SYNCRO_SYNC_POLL_INTERVAL_MS:60000}
    # Redis distributed lock TTL in milliseconds (default 15 minutes — auto-expires on crash)
    lock-ttl-ms: ${SYNCRO_SYNC_LOCK_TTL_MS:900000}
    # Fallback category code used when an external category code is unmapped (story 13-2,
    # OQ-4). Empty = skip unmapped categories as before.
    fallback-category-code: ${SYNCRO_SYNC_FALLBACK_CATEGORY_CODE:}
