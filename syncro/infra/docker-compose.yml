name: syncro-spring

services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - "${POSTGRES_PORT:?POSTGRES_PORT is required}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:?PGADMIN_EMAIL is required}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:?PGADMIN_PASSWORD is required}
    ports:
      - "${PGADMIN_PORT:?PGADMIN_PORT is required}:80"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - pgadmin_data:/var/lib/pgadmin

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:?REDIS_PORT is required}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  influxdb:
    image: influxdb:3-core
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/etc/influxdb3/entrypoint.sh"]
    environment:
      INFLUXDB3_ADMIN_TOKEN: ${INFLUXDB_TOKEN:?INFLUXDB_TOKEN is required}
    ports:
      - "${INFLUXDB_PORT:?INFLUXDB_PORT is required}:8181"
    volumes:
      - influxdb_data:/var/lib/influxdb3
      - ./influxdb/entrypoint.sh:/etc/influxdb3/entrypoint.sh:ro
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8181/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  emqx:
    image: emqx/emqx:6.2.2
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/opt/emqx/etc/syncro/docker-entrypoint.sh"]
    environment:
      EMQX_DASHBOARD__DEFAULT_USERNAME: ${SYNCRO_MQTT_USERNAME:?SYNCRO_MQTT_USERNAME is required}
      EMQX_DASHBOARD__DEFAULT_PASSWORD: ${SYNCRO_MQTT_PASSWORD:?SYNCRO_MQTT_PASSWORD is required}
    ports:
      - "${SYNCRO_MQTT_PORT:?SYNCRO_MQTT_PORT is required}:1883"
      - "${SYNCRO_MQTT_DASHBOARD_PORT:?SYNCRO_MQTT_DASHBOARD_PORT is required}:18083"
    volumes:
      - emqx_data:/opt/emqx/data
      - emqx_log:/opt/emqx/log
      - ./emqx/etc/emqx.conf:/opt/emqx/etc/emqx.conf:ro
      - ./emqx/etc/auth-bootstrap.csv:/opt/emqx/etc/syncro/auth-bootstrap.csv:ro
      - ./emqx/etc/docker-entrypoint.sh:/opt/emqx/etc/syncro/docker-entrypoint.sh:ro
    healthcheck:
      test: ["CMD", "/opt/emqx/bin/emqx", "ctl", "status"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  waha:
    image: devlikeapro/waha:gows-2026.8.1
    restart: unless-stopped
    environment:
      WAHA_API_KEY: ${WAHA_API_KEY:?WAHA_API_KEY is required}
      WHATSAPP_DEFAULT_ENGINE: GOWS
      WAHA_DASHBOARD_USERNAME: ${WAHA_DASHBOARD_USERNAME:-admin}
      WAHA_DASHBOARD_PASSWORD: ${WAHA_DASHBOARD_PASSWORD:?WAHA_DASHBOARD_PASSWORD is required}
      WHATSAPP_SWAGGER_USERNAME: ${WHATSAPP_SWAGGER_USERNAME:-admin}
      WHATSAPP_SWAGGER_PASSWORD: ${WHATSAPP_SWAGGER_PASSWORD:?WHATSAPP_SWAGGER_PASSWORD is required}
      WAHA_AUTO_START: "false"
    ports:
      - "${WAHA_PORT:?WAHA_PORT is required}:3000"
    volumes:
      - waha_sessions:/app/.sessions
      - waha_media:/app/.media

volumes:
  postgres_data:
  pgadmin_data:
  redis_data:
  influxdb_data:

  emqx_data:
  emqx_log:
  waha_sessions:
  waha_media:
