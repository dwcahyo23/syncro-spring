## Place read-only configurations in this file.
## Config precedence order:
##   etc/base.hocon < cluster.hocon < emqx.conf < environment variables

node {
  name = "emqx@127.0.0.1"
  cookie = "emqxsyncrodev"
  data_dir = "data"
}

cluster {
  name = emqxcl
  discovery_strategy = manual
}

## Authentication: built-in database with bcrypt password hashing.
## Users are bootstrapped from auth-bootstrap.csv on first start.
## Credentials: syncro_backend (Spring Boot MQTT consumer) + per-device users.
authentication = [
  {
    backend = built_in_database
    mechanism = password_based
    password_hash_algorithm {
      name = bcrypt
      salt_rounds = 10
    }
    user_id_type = username
    bootstrap_file = "/opt/emqx/etc/syncro/auth-bootstrap.csv"
    bootstrap_type = plain
    enable = true
  }
]

## Authorization (ACL): deny-by-default topic access control.
##
## Policy:
##   - syncro_backend  → subscribe  factory/+/+/telemetry  (wildcard, all plants/machines)
##   - device_{plantCode}_{machineCode} → publish factory/{plantCode}/{machineCode}/telemetry only
##   - All other actions are denied and the connection is disconnected.
##
## ACL rules are seeded at container startup via docker-entrypoint.sh using
## `emqx ctl authz` CLI. Rules survive container restarts via the EMQX data volume.
##
## To add a new device:
##   1. Add credentials to auth-bootstrap.csv (or via EMQX dashboard)
##   2. Add publish ACL rule in docker-entrypoint.sh for that device
##   3. Restart the EMQX container
authorization {
  no_match = deny
  deny_action = disconnect
  cache {
    enable = true
    max_size = 32
    ttl = 1m
  }
  sources = [
    {
      type = built_in_database
      enable = true
    }
  ]
}

