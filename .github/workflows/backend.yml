name: Backend Tests

# DW-176: the backend suite had no automated runner. It is the expensive half
# — ~59 Testcontainers classes, ~30 min on a cold container (DW-142) — so it
# runs on main and on a nightly schedule rather than gating every PR.
#
# A fast/unit slice on pull requests was attempted and reverted: neither
# `-Dtest=!…` nor `-DexcludedGroups` excludes anything here (surefire runs the
# whole suite either way), and tagging the base class does not propagate to
# the 59 subclasses. Splitting by pattern is not clean either — 7 slow classes
# do not carry the *IntegrationTest suffix. Revisit when the suite is split.

on:
  push:
    branches: [main]
    paths:
      - 'syncro/apps/backend/**'
      - 'syncro/.env.example'
      - '.github/workflows/backend.yml'
  schedule:
    # 02:17 UTC daily — off the hour, so it does not pile onto GitHub's
    # busiest scheduling window.
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: mvn test (Testcontainers)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: syncro/apps/backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: syncro/apps/backend/pom.xml

      - name: Test
        run: ./mvnw -B test

      - name: Upload surefire reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: syncro/apps/backend/target/surefire-reports/
          retention-days: 7